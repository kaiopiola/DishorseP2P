<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src *; media-src 'self' blob:;"
    />
    <title>P2P Chat</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>P2P Chat <small>· sem servidor (Trystero)</small></h1>
      <div class="room-bar">
        <input id="room" placeholder="nome da sala" value="daggerfall" />
        <input id="nick" placeholder="seu apelido" />
        <button id="join">Entrar</button>
        <span id="status" class="status">desconectado</span>
        <button id="btnSettings" title="Configurações">⚙</button>
      </div>
    </header>

    <main>
      <section class="videoarea">
        <div class="stage" id="stage">
          <video id="stageVideo" autoplay playsinline muted></video>
          <div class="avatar big" id="stageAvatar"></div>
          <div class="placeholder" id="placeholder">
            ative sua câmera ou tela, ou aguarde peers
          </div>
        </div>
        <div class="filmstrip" id="filmstrip"></div>
      </section>

      <aside class="sidebar">
        <div class="controls">
          <button id="btnMic" disabled>🎤 Microfone</button>
          <button id="btnCam" disabled>📷 Câmera</button>
          <button id="btnScreen" disabled>🖥️ Tela</button>
          <button id="btnPip" disabled title="Picture-in-Picture (prioriza tela compartilhada)">⧉ PiP</button>
        </div>
        <div class="chat">
          <ul id="messages"></ul>
          <form id="chatForm">
            <input id="chatInput" placeholder="mensagem..." autocomplete="off" disabled />
            <button id="chatSend" disabled>Enviar</button>
          </form>
        </div>
      </aside>
    </main>

    <!-- áudio remoto (mic dos peers) fica aqui, sem UI -->
    <div id="audioSinks" style="display: none"></div>

    <!-- gate de apelido (primeira vez) -->
    <div id="nickModal" class="modal hidden">
      <div class="modal-content nick-gate">
        <h2>Bem-vindo 👋</h2>
        <p>Escolha um apelido para entrar na sala.</p>
        <input id="nickInput" placeholder="seu apelido" maxlength="24" autocomplete="off" />
        <button id="nickConfirm">Entrar</button>
      </div>
    </div>

    <!-- configurações -->
    <div id="settingsModal" class="modal hidden">
      <div class="modal-content">
        <h2>Configurações</h2>
        <div class="setting">
          <label for="selMic">🎤 Microfone</label>
          <select id="selMic"></select>
        </div>
        <div class="setting">
          <label for="selSpeaker">🔊 Saída de áudio</label>
          <select id="selSpeaker"></select>
        </div>
        <div class="setting">
          <label for="rngVolume">Volume de saída</label>
          <input type="range" id="rngVolume" min="0" max="100" />
        </div>
        <div class="setting">
          <label>Nível do microfone</label>
          <div class="meter"><div id="meterFill"></div></div>
        </div>
        <div class="setting checks">
          <label><input type="checkbox" id="chkNoise" /> Supressão de ruído</label>
          <label><input type="checkbox" id="chkEcho" /> Cancelamento de eco</label>
          <label><input type="checkbox" id="chkAgc" /> Ganho automático</label>
        </div>
        <button id="settingsClose">Fechar</button>
      </div>
    </div>

    <!-- seletor de fonte de tela -->
    <div id="sourceModal" class="modal hidden">
      <div class="modal-content">
        <h2>Escolha o que compartilhar</h2>
        <div id="sourceList" class="source-list"></div>
        <button id="sourceCancel">Cancelar</button>
      </div>
    </div>

    <script src="dist/renderer.js"></script>
  </body>
</html>
