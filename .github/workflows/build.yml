name: Build Windows

# Dispara a cada push na main (inclusive merges de PR) e manualmente.
# A Release publicada leva a versão do package.json — bump a versão para
# lançar uma atualização que o auto-updater vai distribuir.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write # necessário para o electron-builder criar a Release

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Bundle do renderer (esbuild)
        run: npm run build

      - name: Build do instalador + publicar na Release (electron-builder)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always
